name: Build Windows Executable

on:
  push: 
    branches: ['main']
  workflow_dispatch: 

jobs: 
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: './src/frontend/package-lock.json'
    
    - name: Build React Frontend
      working-directory: ./src/frontend
      run: |
        npm ci
        npm run build

    - name: Build Fat JAR with Maven
      run: ./mvnw clean package -DskipTests

    - name: Create Release Directory
      run: New-Item -ItemType Directory -Force -Path release

    - name: Create Windows Executable with jpackage
      run: |
        jpackage `
          --type exe `
          --name Coltranic `
          --vendor "Coltran Enterprises" `
          --input target/ `
          --main-jar coltranicai.jar `
          --java-options "-Dspring.profiles.active=prod" `
          --win-console `
          --license-file build-assets/terms-of-use.txt `
          --win-shortcut `
          --win-menu `
          --win-dir-chooser `
          --dest release/
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with: 
        name: Coltranic
        path: release/*.exe